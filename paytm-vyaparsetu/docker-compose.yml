services:
  db:
    image: postgres:16-alpine
    container_name: vyaparsetu_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyapar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vyapar_pass}
      POSTGRES_DB: ${POSTGRES_DB:-vyaparsetu_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vyapar_user} -d ${POSTGRES_DB:-vyaparsetu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: vyaparsetu_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_ENV_VARS_DEFAULT_ACCESS=true
      - BACKEND_URL=http://host.docker.internal:8000
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
